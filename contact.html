<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Contact — FORTITUDE</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">

        <img
            src="logo 1.png"
            alt="FORTITUDE"
        >

        <span>FORTITUDE</span>

    </a>

    <nav class="nav-links" id="navLinks">

        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html" class="active">Contact</a>

    </nav>

    <div class="nav-actions">

        <a href="cart.html" class="cart-icon">
            🛒
            <span id="cart-count">0</span>
        </a>

        <button class="menu-btn" id="menuBtn">
            ☰
        </button>

    </div>

</header>


<main>

<section class="page-header">

    <span>FORTITUDE / CONTACT</span>

    <h1>
        LET'S<br>
        <span>TALK.</span>
    </h1>

</section>


<section class="contact-section section">

    <div class="contact-info">

        <span class="section-number">
            GET IN TOUCH
        </span>

        <h2>
            HAVE A<br>
            QUESTION?
        </h2>

        <p>
            Whether you're asking about an order,
            sizing or the next FORTITUDE drop,
            we'd love to hear from you.
        </p>


        <!-- CHANGE EMAIL -->

        <a
            href="mailto:fortitude@example.com"
            class="contact-email"
        >
            fortitude@gmail.com
        </a>


        <div class="social-links">

            <!-- CHANGE THESE LINKS -->

            <a href="#" target="_blank">
                INSTAGRAM
            </a>

            <a href="#" target="_blank">
                TIKTOK
            </a>

        </div>

    </div>


    <form
        class="contact-form"
        id="contactForm"
    >

        <label>
            YOUR NAME
        </label>

        <input
            type="text"
            id="contactName"
            required
        >


        <label>
            YOUR EMAIL
        </label>

        <input
            type="email"
            id="contactEmail"
            required
        >


        <label>
            SUBJECT
        </label>

        <input
            type="text"
            id="contactSubject"
            required
        >


        <label>
            MESSAGE
        </label>

        <textarea
            id="contactMessage"
            rows="6"
            required
        ></textarea>


        <button
            type="submit"
            class="btn btn-dark"
        >
            SEND MESSAGE →
        </button>

    </form>

</section>

</main>


<footer class="footer">

    <div class="footer-bottom">

        <p>© 2026 FORTITUDE.</p>

    </div>

</footer>


<script src="js/main.js"></script>

</body>
</html>
