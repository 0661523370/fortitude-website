<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product — FORTITUDE</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<!-- =====================================================
     NAVIGATION
===================================================== -->

<header class="navbar">

    <a
        href="index.html"
        class="logo"
    >

        <img
            src="logo 1.png"
            alt="FORTITUDE"
        >

        <span>
            FORTITUDE
        </span>

    </a>


    <nav
        class="nav-links"
        id="navLinks"
    >

        <a href="index.html">
            Home
        </a>

        <a href="shop.html">
            Shop
        </a>

        <a href="about.html">
            About
        </a>

        <a href="contact.html">
            Contact
        </a>

    </nav>


    <div class="nav-actions">

        <a
            href="cart.html"
            class="cart-icon"
            aria-label="Shopping cart"
        >

            🛒

            <span id="cart-count">
                0
            </span>

        </a>


        <button
            class="menu-btn"
            id="menuBtn"
            type="button"
            aria-label="Open menu"
        >
            ☰
        </button>

    </div>

</header>



<!-- =====================================================
     PRODUCT
     main.js loads the product and slider here
===================================================== -->

<main>

    <section
        class="product-detail"
        id="productDetail"
    >

        <!-- Product is generated by main.js -->

    </section>

</main>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer class="footer">

    <div class="footer-top">

        <div class="footer-brand">

            <h2>
                FORTITUDE
            </h2>

            <p>
                Creative minds empowered to thrive.
            </p>

        </div>


        <div class="footer-column">

            <h4>
                EXPLORE
            </h4>

            <a href="shop.html">
                Shop
            </a>

            <a href="about.html">
                About
            </a>

            <a href="contact.html">
                Contact
            </a>

        </div>

    </div>


    <div class="footer-bottom">

        <p>
            © 2026 FORTITUDE. All rights reserved.
        </p>

    </div>

</footer>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="js/products.js"></script>

<script src="js/main.js"></script>

<script src="js/cart.js"></script>


</body>

</html>
